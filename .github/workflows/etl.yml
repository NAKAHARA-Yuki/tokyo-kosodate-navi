name: ETL

# レジストリを取得して BigQuery にロードし直す。
#
# 手元のコンテナからは取得元（data.storage.data.metro.tokyo.lg.jp）に到達できないため、
# ETL を回せるのは実質ここだけになる。手動実行のみで、自動では絶対に走らせない
# （WRITE_TRUNCATE で対象データセットを上書きするため）。
#
# 使うのは **ETL 専用の SA**（`kosodate-etl@`）。デプロイ用の SA とは分けている。
# デプロイ用に BigQuery の書き込み権限を足すと、1つの SA が「Cloud Run のデプロイ」と
# 「本番データの全置換」の両方を持つことになるため（ADR 0008 の考え方。issue #144）。
#
# ⚠️ **この SA は staging と prod にも書き込める。** `bigquery.dataEditor` が
# プロジェクト単位でしか付かないため、データセット単位では絞れていない。
# **環境の取り違えを止めているのは権限ではなく、下の `confirm` 入力だけ。**
#
# ⚠️ **prod は `v*.*.*` のタグからしか起動できない。** `production` 環境の
# deployment branch policy がタグだけを許しているため、`main` から起動すると
# **承認画面すら出ずに3秒で failure になる**（ステップが1つも実行されないので
# 原因が読み取れない。実際に一度踏んでいる）。
#
#   Use workflow from : v0.4.0 のようなタグ   ← Branches ではなく Tags タブ
#   対象環境           : prod
#   上書き確認         : prod
#
# 「いま main にあるコード」ではなく「リリース済みのタグ」からしか本番データを
# 置き換えさせない、という制約なので、これは意図された設計。dev と staging は
# 環境の保護が無いのでブランチから起動できる。

on:
  workflow_dispatch:
    inputs:
      target:
        description: 対象環境（prod は v*.*.* のタグから起動すること。main では弾かれる）
        required: true
        type: choice
        options: [dev, staging, prod]
        default: dev
      confirm:
        description: 上書きを承知していることの確認。対象環境名をそのまま入力する
        required: true
        type: string

env:
  GCP_PROJECT_ID: opendatahackathon-503500

jobs:
  etl-dev:
    name: ETL (dev)
    if: inputs.target == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/run-etl
        with:
          target: dev
          confirm: ${{ inputs.confirm }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_ETL_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}

  etl-staging:
    name: ETL (staging)
    if: inputs.target == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/run-etl
        with:
          target: staging
          confirm: ${{ inputs.confirm }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_ETL_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}

  etl-prod:
    name: ETL (prod)
    if: inputs.target == 'prod'
    runs-on: ubuntu-latest
    # 本番データの上書き。GitHub Environments の required reviewers で承認を必須にする
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/run-etl
        with:
          target: prod
          confirm: ${{ inputs.confirm }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_ETL_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}
