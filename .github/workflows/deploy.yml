name: Deploy

# main にマージされたら staging に自動デプロイし、実データで E2E を回す。
# 本番は「v*.*.* タグを打つ」ことでリリースする。
# タグにすることで、本番に入っているコミットが一意に特定でき、
# 切り戻しは前のタグを再デプロイするだけで済む。
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      target:
        description: デプロイ先（本番はタグ push が正規手順。ここでの prod は緊急用）
        required: true
        default: staging
        type: choice
        options: [staging, prod]

concurrency:
  group: deploy-${{ startsWith(github.ref, 'refs/tags/') && 'prod' || github.event.inputs.target || 'staging' }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: opendatahackathon-503500
  REGION: asia-northeast1

jobs:
  deploy-staging:
    name: Deploy to staging
    # main への push（= PR マージ）と、staging 指定の手動実行のときだけ動かす。
    # タグ push は本番リリースなので対象外。
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event.inputs.target == 'staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write # Workload Identity 連携で GCP に認証する
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - id: deploy
        name: Cloud Run にデプロイ
        run: |
          gcloud run deploy kosodate-graph-viewer-staging \
            --source ./app \
            --project "$GCP_PROJECT_ID" \
            --region "$REGION" \
            --allow-unauthenticated \
            --set-env-vars "GCP_PROJECT_ID=$GCP_PROJECT_ID,APP_ENV=staging" \
            --memory 512Mi --cpu 1 --min-instances 0 --max-instances 3 --timeout 120 \
            --quiet
          URL=$(gcloud run services describe kosodate-graph-viewer-staging \
            --project "$GCP_PROJECT_ID" --region "$REGION" --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: 環境が staging を指しているか確認
        run: |
          ENV=$(curl -fsS "${{ steps.deploy.outputs.url }}/healthz" | python3 -c 'import json,sys; print(json.load(sys.stdin)["env"])')
          echo "デプロイ先の APP_ENV: $ENV"
          [ "$ENV" = "staging" ] || { echo "❌ staging 以外を指しています"; exit 1; }

  e2e-staging:
    name: E2E against staging (real data)
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 依存関係をインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Playwright のブラウザを用意
        run: playwright install --with-deps chromium

      # スタブではなく実際にデプロイされた staging を叩く。
      # BigQuery のスキーマ変更やデータの欠損は、ここで初めて検出できる。
      - name: E2E テスト（staging 実データ）
        env:
          E2E_BASE_URL: ${{ needs.deploy-staging.outputs.url }}
        run: pytest e2e

      - name: 失敗時のスクリーンショットを保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-staging-artifacts
          path: test-results/
          if-no-files-found: ignore

  deploy-prod:
    name: Deploy to production
    # v*.*.* タグの push が正規のリソース。手動実行の prod は緊急時の逃げ道として残す。
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'prod')
    runs-on: ubuntu-latest
    # GitHub Environments 側で required reviewers を設定し、承認を必須にする
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: リリース対象を表示
        run: |
          echo "ref    : ${{ github.ref_name }}"
          echo "commit : ${{ github.sha }}"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - id: deploy
        name: Cloud Run にデプロイ
        run: |
          # どのタグ・コミットが本番に入っているかを Cloud Run 側からも追えるようラベルを付ける
          gcloud run deploy kosodate-graph-viewer \
            --source ./app \
            --project "$GCP_PROJECT_ID" \
            --region "$REGION" \
            --allow-unauthenticated \
            --set-env-vars "GCP_PROJECT_ID=$GCP_PROJECT_ID,APP_ENV=prod,RELEASE_VERSION=${{ github.ref_name }}" \
            --labels "release=$(echo '${{ github.ref_name }}' | tr '.' '-' | tr '[:upper:]' '[:lower:]'),commit=${{ github.sha }}" \
            --memory 512Mi --cpu 1 --min-instances 0 --max-instances 3 --timeout 120 \
            --quiet
          URL=$(gcloud run services describe kosodate-graph-viewer \
            --project "$GCP_PROJECT_ID" --region "$REGION" --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: 本番のスモークテスト
        run: |
          BODY=$(curl -fsS "${{ steps.deploy.outputs.url }}/healthz")
          echo "$BODY"
          ENV=$(echo "$BODY" | python3 -c 'import json,sys; print(json.load(sys.stdin)["env"])')
          [ "$ENV" = "prod" ] || { echo "❌ prod 以外を指しています"; exit 1; }
          curl -fsS "${{ steps.deploy.outputs.url }}/api/areas" > /dev/null
          echo "✅ 本番デプロイ完了 (${{ github.ref_name }}): ${{ steps.deploy.outputs.url }}"
