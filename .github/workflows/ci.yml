name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じPRで新しいpushがあったら古いジョブは打ち切る
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Unit/Integration Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          # requirements-dev.txt が `-r` で読む3ファイルを全部挙げる。
          # 存在しないパスを書いてもエラーにはならず、キャッシュが効かなくなるだけなので
          # 気づきにくい（`app/requirements.txt` という実在しないパスが入っていた）。
          cache-dependency-path: |
            requirements.txt
            app/requirements.in
            requirements-dev.txt

      - name: 依存関係をインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check --output-format=github .

      - name: Format check (ruff format)
        run: ruff format --check .

      # GCP 認証は不要。BigQuery / Gemini はテスト内でモックしている。
      - name: Test (pytest)
        run: pytest tests

  e2e:
    name: E2E (stub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            app/requirements.in
            requirements-dev.txt

      # 画面は frontend（Next.js）が持つため、E2E は backend スタブと frontend の
      # 両方を起動する（e2e/conftest.py）。そのため Node.js が要る。
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 依存関係をインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: frontend の依存関係をインストール
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Playwright のブラウザを用意
        run: playwright install --with-deps chromium

      # BigQuery と Gemini をスタブに差し替えたアプリに対して実行するため GCP 認証は不要。
      # 実データでの確認は staging へのデプロイ後に別途行う（deploy.yml）。
      - name: E2E テスト
        run: pytest e2e

      - name: 失敗時のスクリーンショットを保存
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: |
            test-results/
          if-no-files-found: ignore

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Cloud Run へのデプロイ前に、イメージがビルドできることだけ確認する
      - name: アプリのイメージをビルド
        run: docker build -t kosodate-graph-viewer:ci ./app

      - name: フロントエンドのイメージをビルド
        run: docker build -t kosodate-frontend:ci ./frontend

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 依存関係をインストール
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # lib/backend.ts の認証分岐は E2E では片側しか通らない（E2E は
      # BACKEND_REQUIRES_AUTH=false で動くため）。ここで両側を通す（issue #64）。
      - name: ユニットテスト
        working-directory: frontend
        run: npm test

      # BACKEND_URL は実行時にCloud Runの環境変数として渡すため、ビルド時は不要
      # （app/page.tsx は force-dynamic にしており、ビルド時にbackendへは接続しない）。
      - name: Build
        working-directory: frontend
        run: npm run build
