name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じPRで新しいpushがあったら古いジョブは打ち切る
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            app/requirements.txt
            requirements-dev.txt

      - name: 依存関係をインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check --output-format=github .

      - name: Format check (ruff format)
        run: ruff format --check .

      # GCP 認証は不要。BigQuery / Gemini はテスト内でモックしている。
      - name: Test (pytest)
        run: pytest

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cloud Run へのデプロイ前に、イメージがビルドできることだけ確認する
      - name: アプリのイメージをビルド
        run: docker build -t kosodate-graph-viewer:ci ./app
