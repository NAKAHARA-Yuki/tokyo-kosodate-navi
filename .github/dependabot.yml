# 依存の自動更新。
#
# requirements.txt / requirements-dev.txt に上限（`<4` 等）を付けた分、
# 放置すると古いまま塩漬けになる。上限とセットで入れる（docs/adr/0007）。
#
# app/requirements.lock（本番イメージ）はここでは扱えない。Dependabot は
# `make lock` を実行できず、生成には python:3.12-slim が要るため。
# app/requirements.in を更新する PR が来たら、マージ前に `make lock` を回して
# 同じ PR にロックを含めること（CONTRIBUTING.md）。
#
# **まとめるのはマイナー・パッチだけ。メジャーは1件ずつ来させる。**
# 全部を1本にまとめていたら、まだ使えないメジャーが1つ混ざるだけで
# 他の更新まで止まった（#88: typescript 7 と eslint 10 が未対応で、
# 巻き添えで react のパッチ更新も入らなくなった）。
# 分けておけば、通らないものだけがその PR で落ちる。
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    labels:
      - "type: infra"
      - "P3"
    # 1本の PR にまとめる。個別に来ると数が多く、レビューが追いつかない。
    groups:
      python:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    labels:
      - "type: infra"
      - "area: frontend"
      - "P3"
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    labels:
      - "type: infra"
      - "area: ci"
      - "P3"
    # Actions のメジャーは v4→v5 のような routine な更新で、互いに独立している。
    # 1件ずつ来ると月に何本も開くので、ここだけはメジャーもまとめる（ただし別 PR に分ける）。
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      actions-major:
        patterns:
          - "*"
        update-types:
          - major
